imports:
  - base.yaml
infile: catalogue.csv
template: |-
  <{catalogue_iri}>
    a schema:DataCatalog ;
    dcterms:source <https://www.atns.net.au> ;
    schema:citation <https://www.atns.net.au> ;
    schema:dateCreated "2026-07-14"^^xsd:date ;
    schema:description "Draft catalogue wrapper for RDF resources preserving records recovered from the Agreements, Treaties and Negotiated Settlements website."@en ;
    schema:hasPart <{dataset_iri}> ;
    schema:name "ATNS Preservation Catalogue"@en ;
  .

  <{dataset_iri}>
    a schema:Dataset ;
    schema:isPartOf <https://data.idnau.org/pid/resource/d23405b4-fc04-47e2-9e7a-9c5735ae3780> ;
    dcterms:source
      "ATNS_XML_05Apr22 export, sampled from public, non-deleted agreement records."@en ,
      <https://www.atns.net.au> ;
    owl:imports <https://linked.data.gov.au/def/atns/model/> ;
    schema:citation <https://www.atns.net.au> ;
    schema:dateCreated "2026-07-14"^^xsd:date ;
    schema:license <https://creativecommons.org/licenses/by-nc-nd/4.0/> ;
    schema:name "ATNS public agreement sample"@en ;
  .

  <https://data.idnau.org/pid/resource/d23405b4-fc04-47e2-9e7a-9c5735ae3780>
    a schema:Dataset ;
    dcterms:source <https://www.atns.net.au> ;
    schema:citation <https://www.atns.net.au> ;
    schema:conditionsOfAccess "Public"@en ;
    schema:creator <https://orcid.org/0000-0002-1398-7524> ;
    schema:dateCreated "2002"^^xsd:gYear ;
    schema:dateModified "2026-05-25"^^xsd:date ;
    schema:description "The ATNS Database documents agreements, treaties and negotiated settlements between Indigenous peoples and governments, primarily in Australia."@en ;
    schema:license <http://purl.org/NET/rdflicense/cc-by-nc-nd4.0> ;
    schema:name "Agreements, Treaties and Negotiated Settlements"@en ;
    schema:publisher <https://linked.data.gov.au/org/isu> ;
    schema:url "https://www.atns.net.au/"^^xsd:anyURI ;
  .
