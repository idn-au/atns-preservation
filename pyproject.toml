[project]
name = "atns-preservation"
version = "0.1.0"
description = "Reproducible conversion of the preserved ATNS XML export to RDF"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lxml==6.0.1",
    "pyyaml==6.0.3",
    "rdfcon",
]

[tool.uv.sources]
rdfcon = { git = "https://github.com/kurrawong/rdfcon", rev = "v1.11.1" }
